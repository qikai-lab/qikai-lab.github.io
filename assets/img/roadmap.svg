<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="项目五步实施路线图">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ============ 第 0 周徽章 ============ -->
    <rect x="25" y="26" width="252" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
    <circle cx="45" cy="41" r="7" fill="#059669"/>
    <path d="M 41.8 41 L 44.2 43.4 L 48.4 38.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="45.5" font-size="12.5" font-weight="600" fill="#047857">已完成：第 0 周 ~ 第 3 步</text>
    <text x="975" y="45.5" text-anchor="end" font-size="12" fill="#94a3b8">总工期 10 ~ 13 周</text>

    <!-- ============ 连接主干线 ============ -->
    <line x1="115" y1="112" x2="887" y2="112" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

    <!-- ============================================================
         步骤 1
         ============================================================ -->
    <circle cx="115" cy="112" r="17" fill="#0d9488"/>
    <text x="115" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>

    <rect x="25" y="148" width="180" height="190" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="115" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">传感器采集</text>
    <text x="115" y="197" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600">1 ~ 2 周</text>
    <line x1="45" y1="211" x2="185" y2="211" stroke="#ccfbf1" stroke-width="1"/>
    <text x="45" y="233" font-size="11" fill="#475569">· 温湿度 / 烟雾 / 光照</text>
    <text x="45" y="255" font-size="11" fill="#475569">· 人体感应 + 继电器</text>
    <text x="45" y="277" font-size="11" fill="#475569">· 彩屏显示 + 串口帧</text>
    <rect x="41" y="296" width="148" height="26" rx="6" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="115" y="313" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="600">✓ 达成：串口能读传感器</text>

    <!-- ============================================================
         步骤 2
         ============================================================ -->
    <circle cx="308" cy="112" r="17" fill="#0891b2"/>
    <text x="308" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>

    <rect x="218" y="148" width="180" height="190" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <text x="308" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">无线组网</text>
    <text x="308" y="197" text-anchor="middle" font-size="11" fill="#0e7490" font-weight="600">2 周</text>
    <line x1="238" y1="211" x2="378" y2="211" stroke="#cffafe" stroke-width="1"/>
    <text x="238" y="233" font-size="11" fill="#475569">· Coordinator 建网</text>
    <text x="238" y="255" font-size="11" fill="#475569">· EndDevice 入网</text>
    <text x="238" y="277" font-size="11" fill="#475569">· 电池供电仍在线</text>
    <rect x="234" y="296" width="148" height="26" rx="6" fill="#ffffff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="308" y="313" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="600">✓ 达成：两块板无线通信</text>

    <!-- ============================================================
         步骤 3
         ============================================================ -->
    <circle cx="501" cy="112" r="17" fill="#4f46e5"/>
    <text x="501" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>

    <rect x="411" y="148" width="180" height="190" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="501" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Linux 网关</text>
    <text x="501" y="197" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="600">2 ~ 3 周 · 主战场</text>
    <line x1="431" y1="211" x2="571" y2="211" stroke="#e0e7ff" stroke-width="1"/>
    <text x="431" y="233" font-size="11" fill="#475569">· epoll 串口采集</text>
    <text x="431" y="255" font-size="11" fill="#475569">· SQLite 事务 + WAL</text>
    <text x="431" y="277" font-size="11" fill="#475569">· 自写 socket HTTP</text>
    <rect x="427" y="296" width="148" height="26" rx="6" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="501" y="313" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="600">✓ 达成：网页看历史曲线</text>

    <!-- ============================================================
         步骤 4
         ============================================================ -->
    <circle cx="694" cy="112" r="17" fill="#7c3aed"/>
    <text x="694" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>

    <rect x="604" y="148" width="180" height="190" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="694" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ESP32 上云</text>
    <text x="694" y="197" text-anchor="middle" font-size="11" fill="#6d28d9" font-weight="600">1 ~ 2 周</text>
    <line x1="624" y1="211" x2="764" y2="211" stroke="#ede9fe" stroke-width="1"/>
    <text x="624" y="233" font-size="11" fill="#475569">· 串口转 MQTT</text>
    <text x="624" y="255" font-size="11" fill="#475569">· BLE 手机配网</text>
    <text x="624" y="277" font-size="11" fill="#475569">· 断线遗嘱 LWT</text>
    <rect x="620" y="296" width="148" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="694" y="313" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="600">产出：脱离电脑独立运行</text>

    <!-- ============================================================
         步骤 5
         ============================================================ -->
    <circle cx="887" cy="112" r="17" fill="#db2777"/>
    <text x="887" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>

    <rect x="797" y="148" width="180" height="190" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="887" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">告警与控制</text>
    <text x="887" y="197" text-anchor="middle" font-size="11" fill="#be185d" font-weight="600">2 周</text>
    <line x1="817" y1="211" x2="957" y2="211" stroke="#fce7f3" stroke-width="1"/>
    <text x="817" y="233" font-size="11" fill="#475569">· 超限告警推送</text>
    <text x="817" y="255" font-size="11" fill="#475569">· 网页控继电器</text>
    <text x="817" y="277" font-size="11" fill="#475569">· 低功耗 + systemd</text>
    <rect x="813" y="296" width="148" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="887" y="313" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="600">◐ 告警已上线，远控待做</text>

    <!-- ============ 底部标注 ============ -->
    <line x1="25" y1="372" x2="975" y2="372" stroke="#f1f5f9" stroke-width="1"/>
    <text x="25" y="398" font-size="11.5" fill="#94a3b8">第 1 步只用终端节点板 · 第 2 步起两块板都上 · 第 3 步起 Linux 侧代码量占全部工程 60% 以上</text>
    <text x="25" y="420" font-size="11.5" fill="#94a3b8">每一步都有可演示的产出，不追求一次性做完 —— 面试时能指着说“这个功能我做过”比什么都重要</text>
  </g>
</svg>
